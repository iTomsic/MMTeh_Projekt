<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predstavljanje studenata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header"></div>

<main>
    <div class="students-grid">

        <!-- Student 1 -->
        <div class="student-card">
            <div class="card-img-wrap" onclick="zoomImage(this.querySelector('img'))">
                <img src="mediji/filipSlika.jpeg" alt="Student 1">
            </div>
            <div class="card-body">
                <h2>Ime Prezime 1</h2>
                <p>Datum rođenja: 01.01.2000</p>
                <p>Mjesto rođenja: Osijek</p>
                <div class="btn">
                    <a href="student1.html" class="">Pročitaj više</a>
                </div>
            </div>
        </div>

        <!-- Student 2 -->
        <div class="student-card">
            <div class="card-img-wrap" onclick="zoomImage(this.querySelector('img'))">
                <img src="slika2.jpg" alt="Student 2">
            </div>
            <div class="card-body">
                <h2>Ime Prezime 2</h2>
                <p>Datum rođenja: 02.02.2000</p>
                <p>Mjesto rođenja: Osijek</p>
                <div class="btn">
                    <a href="student2.html" class="">Pročitaj više</a>
                </div>
            </div>
        </div>

    </div>
</main>

<footer>
    <p>Izrađeno u sklopu kolegija Multimedijska tehnika</p>
    <div class="footer-links">
        <a href="https://www.ferit.unios.hr/" target="_blank">FERIT Osijek</a>
        <a href="https://www.ferit.unios.hr/upisi-i-studijski-programi/strucni-prijediplomski-studij#racunarstvo#SR6-02" target="_blank">Multimedijska tehnika</a>
        <a href="student1.html">Student 1</a>
        <a href="student2.html">Student 2</a>
    
    </div>
</footer>

<!-- Image zoom modal -->
<div id="modal" class="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()" aria-label="Zatvori">&times;</button>
    <img class="modal-content" id="zoomedImg" alt="Uvećana slika">
</div>

<script src="scripts.js"></script>

</body>
</html>
